<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>진화의 특이점</title>
  <script src="/device-router.js"></script>
  <script>
    (function () {
      try {
        if (window.DeviceRouter?.redirectByDevice) {
          window.DeviceRouter.redirectByDevice();
          return;
        }
      } catch (error) {
        console.error("DeviceRouter error:", error);
      }
      window.location.replace("/desktop.html");
    })();
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0; url=/desktop.html" />
  </noscript>
</head>
<body></body>
</html>
