<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>진화의 특이점</title>
  <script>
    (function () {
      try {
        var ua = navigator.userAgent || "";
        var uaMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);
        var coarsePointer =
          typeof window.matchMedia === "function" &&
          window.matchMedia("(pointer: coarse)").matches;
        var touchPoints = navigator.maxTouchPoints || 0;
        var screenWidth =
          window.screen && typeof window.screen.width === "number"
            ? window.screen.width
            : window.innerWidth || 0;
        var viewportWidth = window.innerWidth || screenWidth;
        var smallViewport = Math.min(viewportWidth, screenWidth) <= 900;
        var isMobile = uaMobile || (coarsePointer && smallViewport) || (touchPoints > 1 && smallViewport);
        var suffix = (window.location.search || "") + (window.location.hash || "");
        var target = isMobile ? "./mobile.html" : "./desktop.html";
        window.location.replace(target + suffix);
      } catch (error) {
        window.location.replace("./desktop.html");
      }
    })();
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0; url=./desktop.html" />
  </noscript>
</head>
<body></body>
</html>
