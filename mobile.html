<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>진화의 특이점</title>
  <link rel="icon" type="image/png" href="./assets/efavicon.png" />
  <link rel="stylesheet" href="mobile.css" />
</head>
<body>
  <main class="mobile-shell">
    <img
      id="mobileCoverImage"
      class="mobile-cover-image"
      src="assets/cover-sample.png"
      alt="진화의 특이점 표지"
    />

    <div class="mobile-middle-spacer">
      <p class="mobile-desktop-hint">보다 원활한 이용을 위해 PC 사용을 권장드립니다.</p>
    </div>

    <div class="mobile-actions">
      <button id="mobileCopyLinkBtn" class="mobile-copy-btn" type="button">링크 복사하기</button>
      <button id="mobileStartReadingBtn" class="mobile-read-btn" type="button">책 읽기</button>
    </div>
  </main>

  <script src="device-router.js"></script>
  <script src="mobile-guard.js"></script>
  <script src="mobile.js"></script>
</body>
</html>
