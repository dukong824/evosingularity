<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>진화의 특이점</title>
  <link rel="icon" type="image/png" href="./assets/wfavicon.png" />
  <link rel="stylesheet" href="mobile-reader.css" />
</head>
<body>
  <header class="mobile-reader-topbar">
    <h1 id="mobileReaderTitle" class="topbar-title">진화의 특이점</h1>
    <button
      id="mobileReaderSettingsBtn"
      class="topbar-menu-btn"
      type="button"
      aria-expanded="false"
      aria-controls="mobileReaderMenuSheet"
      aria-label="메뉴 열기"
    >
      <img class="topbar-menu-icon" src="assets/menuicon.png" alt="" />
    </button>
  </header>

  <div id="mobileReaderMenuSheet" class="menu-sheet hidden" aria-hidden="true">
    <button
      id="mobileReaderMenuBackdrop"
      class="menu-sheet-backdrop"
      type="button"
      aria-label="메뉴 닫기"
    ></button>

    <div class="menu-sheet-panel" role="dialog" aria-modal="true" aria-label="메뉴">
      <div class="menu-sheet-view" role="group" aria-label="메뉴">
        <a
          id="mobileReaderHomeBtn"
          class="menu-sheet-action"
          href="./mobile.html"
          aria-label="홈으로 가기"
          title="홈으로 가기"
        >
          <img class="menu-sheet-action-icon" src="assets/homeicon.png" alt="" />
          <span class="menu-sheet-action-label">홈</span>
        </a>

        <button
          id="mobileReaderToggleTocBtn"
          class="menu-sheet-action"
          type="button"
          aria-label="목차"
          title="목차"
          aria-expanded="false"
          aria-controls="mobileReaderTocPanel"
        >
          <img class="menu-sheet-action-icon" src="assets/bookmarkicon.png" alt="" />
          <span class="menu-sheet-action-label">목차</span>
        </button>

        <div id="mobileReaderTocPanel" class="menu-sheet-subpanel" aria-hidden="true">
          <div id="mobileReaderTocList" class="menu-sheet-toc-list" role="list"></div>
        </div>

        <div class="menu-sheet-action-row">
          <button
            id="mobileReaderToggleSettingsBtn"
            class="menu-sheet-action menu-sheet-action-main"
            type="button"
            aria-label="페이지 설정"
            title="페이지 설정"
            aria-expanded="false"
            aria-controls="mobileReaderSettingsPanel"
          >
            <img class="menu-sheet-action-icon" src="assets/textsettingsicon.png" alt="" />
            <span class="menu-sheet-action-label">페이지 설정</span>
          </button>
          <button
            id="mobileReaderResetSettingsBtn"
            class="menu-settings-reset menu-settings-inline-reset"
            type="button"
            disabled
            aria-hidden="true"
          >
            기본값 초기화
          </button>
        </div>

        <section id="mobileReaderSettingsPanel" class="menu-sheet-subpanel" aria-hidden="true" aria-label="페이지 설정">
          <div class="settings-item settings-item-select">
            <label id="mobileReaderPageToneLabel" for="mobileReaderPageToneTrigger">페이지 색</label>
            <div id="mobileReaderPageToneSelect" class="custom-select">
              <button
                id="mobileReaderPageToneTrigger"
                class="custom-select-trigger"
                type="button"
                aria-haspopup="listbox"
                aria-expanded="false"
                aria-labelledby="mobileReaderPageToneLabel mobileReaderPageToneTriggerText"
              >
                <span id="mobileReaderPageToneTriggerText">화이트</span>
              </button>

              <div
                id="mobileReaderPageToneOptions"
                class="custom-select-options hidden"
                role="listbox"
                aria-labelledby="mobileReaderPageToneLabel"
              >
                <button class="custom-select-option is-selected" type="button" role="option" aria-selected="true" data-value="white">화이트</button>
                <button class="custom-select-option" type="button" role="option" aria-selected="false" data-value="default">아이보리</button>
                <button class="custom-select-option" type="button" role="option" aria-selected="false" data-value="warm">베이지</button>
              </div>
            </div>
          </div>

          <div class="settings-item">
            <label for="fontSizeInput">글자 크기</label>
            <input id="fontSizeInput" type="range" min="14" max="26" step="1" value="18" />
            <span id="fontSizeValue">18px</span>
          </div>

          <div class="settings-item">
            <label for="lineHeightInput">줄 간격</label>
            <input id="lineHeightInput" type="range" min="1.4" max="2.2" step="0.1" value="1.9" />
            <span id="lineHeightValue">1.9</span>
          </div>

          <div class="settings-item">
            <label for="pagePadYInput">상하 여백</label>
            <input id="pagePadYInput" type="range" min="12" max="56" step="1" value="22" />
            <span id="pagePadYValue">22px</span>
          </div>

          <div class="settings-item">
            <label for="sidePaddingInput">좌우 여백</label>
            <input id="sidePaddingInput" type="range" min="12" max="80" step="1" value="35" />
            <span id="sidePaddingValue">35px</span>
          </div>
        </section>
      </div>
    </div>
  </div>

  <main id="mobileReader" class="mobile-reader-main">
    <section id="mobileReaderPageShell" class="mobile-reader-stage">
      <article id="mobileReaderPage" class="mobile-reader-page">
        <div id="mobileReaderPageContent" class="mobile-reader-page-content" aria-live="polite">
          <p class="reader-loading">불러오는 중...</p>
        </div>
      </article>
    </section>

    <nav class="mobile-reader-nav" aria-label="페이지 이동">
      <button
        id="mobileReaderPrevBtn"
        class="mobile-reader-nav-btn"
        type="button"
        aria-label="이전 페이지"
        title="이전 페이지"
      >
        <span class="mobile-reader-nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false">
            <polygon points="6.6,12 17,6 17,18" />
          </svg>
        </span>
        <span class="mobile-reader-nav-label">이전</span>
      </button>
      <button
        id="mobileReaderNextBtn"
        class="mobile-reader-nav-btn"
        type="button"
        aria-label="다음 페이지"
        title="다음 페이지"
      >
        <span class="mobile-reader-nav-label">다음</span>
        <span class="mobile-reader-nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false">
            <polygon points="17.4,12 7,6 7,18" />
          </svg>
        </span>
      </button>
    </nav>
  </main>

  <script src="mobile-reader.js"></script>
</body>
</html>
