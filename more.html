<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>More | 진화의 특이점</title>
  <link rel="icon" type="image/png" href="./assets/wfavicon.png" />
  <link rel="stylesheet" href="./secondary.css" />
</head>
<body>
  <main class="secondary-shell">
    <section class="secondary-page secondary-page-more secondary-page-contact" aria-label="Contact">
      <header class="secondary-header">
        <img class="secondary-logo" src="./assets/logo.png" alt="진화의 특이점" />
      </header>

      <div class="secondary-contact-list" aria-label="Contact information">
        <section class="secondary-contact-item" aria-labelledby="phoneTitle">
          <p id="phoneTitle" class="secondary-contact-label">Phone</p>
          <p class="secondary-contact-value">010-0000-0000</p>
        </section>
        <section class="secondary-contact-item" aria-labelledby="emailTitle">
          <p id="emailTitle" class="secondary-contact-label">Email</p>
          <p class="secondary-contact-value">yunjiho@evosingularity.com</p>
        </section>
      </div>

      <form
        id="contactForm"
        class="secondary-form secondary-form-compact"
        action="https://formsubmit.co/yunjiho@evosingularity.com"
        method="POST"
      >
        <input type="hidden" name="_subject" value="진화의 특이점 문의" />
        <input type="hidden" name="_template" value="table" />
        <input id="contactFormUrl" type="hidden" name="_url" value="" />
        <input id="contactFormNext" type="hidden" name="_next" value="" />
        <input class="secondary-honeypot" type="text" name="_honey" tabindex="-1" autocomplete="off" />
        <label class="secondary-field">
          <span>Name</span>
          <input type="text" name="name" autocomplete="name" placeholder="이름을 입력해 주세요" required />
        </label>
        <label class="secondary-field">
          <span>Email</span>
          <input type="email" name="email" autocomplete="email" placeholder="you@example.com" required />
        </label>
        <label class="secondary-field">
          <span>Message</span>
          <textarea name="message" placeholder="메시지를 입력해 주세요" required></textarea>
        </label>
        <button class="secondary-submit-button" type="submit">보내기</button>
        <p id="contactSuccessStatus" class="secondary-status" hidden>Message sent</p>
      </form>
    </section>
  </main>

  <script src="./device-router.js"></script>
  <script src="./desktop-guard.js"></script>
  <script src="./more.js"></script>
</body>
</html>
